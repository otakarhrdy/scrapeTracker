services:
  - type: web
    name: scrapetracker
    runtime: node
    plan: starter
    buildCommand: bash render-build.sh
    startCommand: cd backend && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_IN_PROCESS_CRON
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_SECRET
        sync: false
